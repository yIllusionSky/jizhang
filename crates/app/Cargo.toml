[package]
name = "jizhang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wallet-ledger = { path = "../ledger" }
chrono = "0.4"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
gpui-kit = "=0.7.0"
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "9075e3aa3eea812127f2c60ed66f0cd5798ff245", default-features = false }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"
jni = "0.22"
